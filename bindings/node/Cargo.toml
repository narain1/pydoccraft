[package]
name = "doccraft-node-preview"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
pydoccraft-core = { path = "../..", default-features = false }
serde_json = "=1.0.149"

# Cargo ignores patches in dependency manifests. Keep these identical to the root.
[patch.crates-io]
hayro = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
hayro-cmap = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
hayro-interpret = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
hayro-postscript = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
krilla = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
