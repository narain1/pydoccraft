name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Rust and installed-wheel tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup default 1.95.0

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check maturin==1.8.1 -r tools/typing-requirements.txt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Audit locked license graph
        run: |
          cargo metadata --locked --format-version 1 > /tmp/cargo-metadata.json
          python tools/audit_licenses.py /tmp/cargo-metadata.json

      - name: Build wheel
        run: maturin build --release --locked --out dist

      - name: Install built wheel
        run: python -m pip install --no-index --find-links dist pydoccraft

      - name: Check public typing against installed wheel
        run: python -m mypy --strict --follow-imports=silent --python-executable "$(command -v python)" tools/check_public_typing.py

      - name: Run tests against installed wheel
        run: python tools/validate_installed.py --wheel-dir dist --output dist/validation.json

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-evidence
          path: dist/validation.json
          if-no-files-found: warn

  binding-previews:
    name: Python-free Rust and binding previews
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TARGET_DIR: ${{ runner.temp }}/pydoccraft-go-target
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Check preview toolchains
        run: |
          go version
          node --version

      - name: Test Python-free Rust API
        run: cargo test --locked --no-default-features

      - name: Build and test Go preview
        env:
          PYDOCCRAFT_GO_LIB_DIR: ${{ runner.temp }}/pydoccraft-go-lib
          GOPROXY: "off"
        run: |
          sh bindings/go/build.sh
          cd bindings/go
          CGO_LDFLAGS="-L$PYDOCCRAFT_GO_LIB_DIR" LD_LIBRARY_PATH="$PYDOCCRAFT_GO_LIB_DIR" go test -race -count=1 ./...

      - name: Build and test Node preview
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/pydoccraft-node-target
        run: |
          cargo build --locked --manifest-path bindings/node/Cargo.toml
          cp "$CARGO_TARGET_DIR/debug/libdoccraft_node_preview.so" bindings/node/doccraft.node
          node --test bindings/node/test/*.test.js
