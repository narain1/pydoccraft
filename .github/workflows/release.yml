name: Build and publish wheels

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify release version
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_build: ${{ steps.version.outputs.should_build }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || inputs.release_tag }}

      - name: Verify source and detect version change
        id: version
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || inputs.release_tag }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          source = os.environ["SOURCE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", source):
              raise SystemExit("source must be an exact 40-character commit SHA")
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != source:
              raise SystemExit(f"checked-out commit {actual!r} does not match {source!r}")
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          should_build = True
          if os.environ["EVENT_NAME"] == "pull_request":
              subprocess.run(["git", "fetch", "--no-tags", "origin", os.environ["BASE_SHA"]], check=True)
              previous = subprocess.check_output(["git", "show", f"{os.environ['BASE_SHA']}:pyproject.toml"], text=True)
              should_build = tomllib.loads(previous)["project"]["version"] != version
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"release_tag=v{version}", file=output)
              print(f"should_build={str(should_build).lower()}", file=output)

  wheels:
    name: Wheel (${{ matrix.os }}, Python ${{ matrix.python.version }})
    needs: verify-version
    if: needs.verify-version.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python:
          - version: "3.11"
            tag: "311"
          - version: "3.12"
            tag: "312"
          - version: "3.13"
            tag: "313"
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || inputs.release_tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python.version }}

      - name: Build Linux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          maturin-version: 1.8.1
          rust-toolchain: 1.95.0
          args: --release --locked --out dist --interpreter /opt/python/cp${{ matrix.python.tag }}-cp${{ matrix.python.tag }}/bin/python
          manylinux: auto

      - name: Build macOS or Windows wheel
        if: runner.os != 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          maturin-version: 1.8.1
          rust-toolchain: 1.95.0
          args: --release --locked --out dist --interpreter python

      - name: Test installed wheel
        run: |
          python -m pip install --no-index --find-links dist pydoccraft
          python tools/validate_installed.py --wheel-dir dist --output dist/validation.json

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python.version }}
          path: dist/validation.json
          if-no-files-found: warn

      - name: Upload wheel
        if: success() || (failure() && github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python.version }}
          path: dist/*.whl
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    needs: [verify-version, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-version.outputs.release_tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to publish a different commit" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/*.whl --repo "$GITHUB_REPOSITORY" --target "$MERGE_SHA" --generate-notes

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    needs: [verify-version, wheels, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pydoccraft/
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
