name: Validate portable font fixtures

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag, or exact commit SHA for validation only
        required: true
        type: string
      validation_only:
        description: Validate wheels without a version tag or any publication
        required: true
        default: true
        type: boolean
      publish:
        description: Publish wheels to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.release_tag }}

      - name: Verify immutable validation source or release version
        shell: python
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          VALIDATION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_only }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if os.environ["VALIDATION_ONLY"] != "true" or os.environ["PUBLISH"] != "false":
              raise SystemExit("diagnostics requires validation_only=true and publish=false")
          if os.environ["VALIDATION_ONLY"] == "true":
              if os.environ["PUBLISH"] == "true":
                  raise SystemExit("validation-only mode cannot publish")
              if not re.fullmatch(r"[0-9a-f]{40}", tag):
                  raise SystemExit("validation-only mode requires an exact 40-character commit SHA")
              actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              if actual != tag:
                  raise SystemExit(f"checked-out commit {actual!r} does not match {tag!r}")
          elif tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match package version {version!r}")

  wheels:
    name: Wheel (${{ matrix.os }}, Python ${{ matrix.python.version }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python:
          - version: "3.12"
            tag: "312"
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.release_tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python.version }}

      - name: Download exact diagnostic wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python.version }}
          path: dist
          run-id: 39584493636
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download original wheel validation identity
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python.version }}
          path: dist/baseline
          run-id: 39584493636
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify reused wheel and unchanged dependency identity
        shell: python
        run: |
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          evidence = json.loads(Path("dist/baseline/validation.json").read_text(encoding="utf-8"))
          wheels = list(Path("dist").glob("pydoccraft-*.whl"))
          if len(wheels) != 1:
              raise SystemExit("expected exactly one diagnostic wheel")
          if hashlib.sha256(wheels[0].read_bytes()).hexdigest() != evidence["wheel_sha256"]:
              raise SystemExit("downloaded wheel differs from original validation identity")
          if hashlib.sha256(Path("Cargo.lock").read_bytes()).hexdigest() != evidence["cargo_lock_sha256"]:
              raise SystemExit("fixture source changed native dependencies")
          with zipfile.ZipFile(wheels[0]) as archive:
              for item in archive.infolist():
                  if item.filename.startswith("doc_ex/") and item.filename.endswith((".py", ".pyi", "py.typed")):
                      if (Path("src") / item.filename).read_bytes() != archive.read(item):
                          raise SystemExit("source facade differs from reused wheel: " + item.filename)
          print("Reusing diagnostic wheel:", wheels[0].name, evidence["wheel_sha256"])
          print("Original validation passed:", evidence["passed"])

      - name: Test installed wheel
        run: |
          python -m pip install --no-index --find-links dist pydoccraft
          python tools/validate_installed.py --wheel-dir dist --output dist/validation.json

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python.version }}
          path: dist/validation.json
          if-no-files-found: warn
