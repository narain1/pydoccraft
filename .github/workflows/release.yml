name: Build and publish wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag, or exact commit SHA for validation only
        required: true
        type: string
      validation_only:
        description: Validate wheels without a version tag or any publication
        required: true
        default: false
        type: boolean
      publish:
        description: Publish wheels to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.release_tag }}

      - name: Verify immutable validation source or release version
        shell: python
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          VALIDATION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_only }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if os.environ["VALIDATION_ONLY"] == "true":
              if os.environ["PUBLISH"] == "true":
                  raise SystemExit("validation-only mode cannot publish")
              if not re.fullmatch(r"[0-9a-f]{40}", tag):
                  raise SystemExit("validation-only mode requires an exact 40-character commit SHA")
              actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              if actual != tag:
                  raise SystemExit(f"checked-out commit {actual!r} does not match {tag!r}")
          elif tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match package version {version!r}")

  wheels:
    name: Wheel (${{ matrix.os }}, Python ${{ matrix.python.version }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python:
          - version: "3.11"
            tag: "311"
          - version: "3.12"
            tag: "312"
          - version: "3.13"
            tag: "313"
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.release_tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python.version }}

      - name: Build Linux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          maturin-version: 1.8.1
          rust-toolchain: 1.95.0
          args: --release --locked --out dist --interpreter /opt/python/cp${{ matrix.python.tag }}-cp${{ matrix.python.tag }}/bin/python
          manylinux: auto

      - name: Build macOS or Windows wheel
        if: runner.os != 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          maturin-version: 1.8.1
          rust-toolchain: 1.95.0
          args: --release --locked --out dist --interpreter python

      - name: Test installed wheel
        run: |
          python -m pip install --no-index --find-links dist pydoccraft
          python tools/validate_installed.py --wheel-dir dist --output dist/validation.json

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python.version }}
          path: dist/validation.json
          if-no-files-found: warn

      - name: Upload wheel
        if: success() || (failure() && github.event_name == 'workflow_dispatch' && inputs.validation_only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python.version }}
          path: dist/*.whl
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    if: github.event_name == 'push' || !inputs.validation_only
    needs: wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.whl --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.whl --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' || (inputs.publish && !inputs.validation_only)
    needs: wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pydoccraft/
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
