[package]
name = "pydoccraft-core"
version = "0.2.1"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]
path = "rust/src/lib.rs"

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
base64 = "=0.22.1"
futures = "=0.3.32"
lexepub = { version = "=0.1.2", default-features = false }
deckcraft-model = { git = "https://github.com/storytold/deckcraft", rev = "22db9261f9d1a214c296fd390173130c45d76d66" }
deckcraft-pdf = { git = "https://github.com/storytold/deckcraft", rev = "22db9261f9d1a214c296fd390173130c45d76d66" }
deckcraft-pptx = { git = "https://github.com/storytold/deckcraft", rev = "22db9261f9d1a214c296fd390173130c45d76d66" }
deckcraft-render = { git = "https://github.com/storytold/deckcraft", rev = "22db9261f9d1a214c296fd390173130c45d76d66" }
kurbo = "=0.13.1"
pdfcraft-annot = { git = "https://github.com/storytold/pdfcraft", rev = "645016addcfb9078c557f0189559ab47cdcee057" }
pdfcraft-cos = { git = "https://github.com/storytold/pdfcraft", rev = "645016addcfb9078c557f0189559ab47cdcee057" }
pdfcraft-model = { git = "https://github.com/storytold/pdfcraft", rev = "645016addcfb9078c557f0189559ab47cdcee057" }
pdfcraft-content = { git = "https://github.com/storytold/pdfcraft", rev = "645016addcfb9078c557f0189559ab47cdcee057" }
pdfcraft-create = { git = "https://github.com/storytold/pdfcraft", rev = "645016addcfb9078c557f0189559ab47cdcee057" }
pdfcraft-edit = { git = "https://github.com/storytold/pdfcraft", rev = "645016addcfb9078c557f0189559ab47cdcee057" }
pdfcraft-export = { git = "https://github.com/storytold/pdfcraft", rev = "645016addcfb9078c557f0189559ab47cdcee057" }
pdfcraft-fonts = { git = "https://github.com/storytold/pdfcraft", rev = "645016addcfb9078c557f0189559ab47cdcee057" }
pdfcraft-forms = { git = "https://github.com/storytold/pdfcraft", rev = "645016addcfb9078c557f0189559ab47cdcee057" }
pdfcraft-organize = { git = "https://github.com/storytold/pdfcraft", rev = "645016addcfb9078c557f0189559ab47cdcee057" }
pdfcraft-render = { git = "https://github.com/storytold/pdfcraft", rev = "645016addcfb9078c557f0189559ab47cdcee057" }
png = "=0.18.1"
pyo3 = { version = "=0.23.5" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
skrifa = "=0.44.0"
thiserror = "=2.0.21"
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "f2e15cf8f899a79899a2d9595ca4ce7df1e5ea22" }
wordcraft-docx = { git = "https://github.com/storytold/wordcraft", rev = "f2e15cf8f899a79899a2d9595ca4ce7df1e5ea22" }
wordcraft-layout = { git = "https://github.com/storytold/wordcraft", rev = "f2e15cf8f899a79899a2d9595ca4ce7df1e5ea22" }
wordcraft-pdf = { git = "https://github.com/storytold/wordcraft", rev = "f2e15cf8f899a79899a2d9595ca4ce7df1e5ea22" }
wordcraft-render = { git = "https://github.com/storytold/wordcraft", rev = "f2e15cf8f899a79899a2d9595ca4ce7df1e5ea22" }
zip = { version = "=2.2.2", default-features = false, features = ["deflate"] }

[patch.crates-io]
hayro = { path = "vendor/pdfcraft/hayro" }
hayro-interpret = { path = "vendor/pdfcraft/hayro-interpret" }
hayro-jbig2 = { path = "vendor/pdfcraft/hayro-jbig2" }
hayro-syntax = { path = "vendor/pdfcraft/hayro-syntax" }
lopdf = { path = "vendor/pdfcraft/lopdf" }
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c3487320b2d1de657b860b3c8abb44e1f2b32bd8" }
