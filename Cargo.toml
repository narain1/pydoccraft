[package]
name = "pydoccraft-core"
version = "0.3.2"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]
path = "rust/src/lib.rs"

[features]
default = ["python"]
python = ["dep:hound", "dep:mp3dec", "dep:ogg", "dep:oxideav-aac", "dep:oxideav-av1", "dep:oxideav-core", "dep:oxideav-h264", "dep:oxideav-mkv", "dep:oxideav-mp4", "dep:oxideav-opus", "dep:oxideav-theora", "dep:oxideav-vorbis", "dep:oxideav-vp8", "dep:oxideav-vp9", "dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
base64 = "=0.22.1"
color = "=0.3.3"
deckcraft-model = { git = "https://github.com/storytold/deckcraft", rev = "f7a7fd7f5ffda19758584908730216222e387aa6" }
deckcraft-pdf = { git = "https://github.com/storytold/deckcraft", rev = "f7a7fd7f5ffda19758584908730216222e387aa6" }
deckcraft-pptx = { git = "https://github.com/storytold/deckcraft", rev = "f7a7fd7f5ffda19758584908730216222e387aa6" }
deckcraft-render = { git = "https://github.com/storytold/deckcraft", rev = "f7a7fd7f5ffda19758584908730216222e387aa6" }
kurbo = "=0.13.1"
pdfcraft-annot = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
pdfcraft-cos = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
pdfcraft-model = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
pdfcraft-content = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
pdfcraft-create = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
pdfcraft-edit = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
pdfcraft-export = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
pdfcraft-fonts = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
pdfcraft-forms = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
pdfcraft-organize = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
pdfcraft-render = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
png = "=0.18.1"
pyo3 = { version = "=0.23.5", optional = true }
quick-xml = "=0.41.0"
raffia = "=0.13.0"
rbook = { version = "=0.7.12", default-features = false, features = ["write"] }
resvg = { version = "=0.50.0", default-features = false, features = ["text", "system-fonts", "raster-images"] }
roxmltree = "=0.21.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha1 = "=0.11.0"
skrifa = "=0.44.0"
unicode-bidi = "=0.3.18"
unicode-segmentation = "=1.13.3"
write-fonts = { version = "=0.48.1", features = ["read"] }
taffy = { version = "=0.16.0", default-features = false, features = ["std", "taffy_tree", "block_layout", "flexbox", "grid", "content_size"] }
thiserror = "=2.0.21"
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "bbe3547dd11bb5f613f3aa893b12f593910644de" }
wordcraft-docx = { git = "https://github.com/storytold/wordcraft", rev = "bbe3547dd11bb5f613f3aa893b12f593910644de" }
wordcraft-geom = { git = "https://github.com/storytold/wordcraft", rev = "bbe3547dd11bb5f613f3aa893b12f593910644de" }
wordcraft-layout = { git = "https://github.com/storytold/wordcraft", rev = "bbe3547dd11bb5f613f3aa893b12f593910644de" }
wordcraft-pdf = { git = "https://github.com/storytold/wordcraft", rev = "bbe3547dd11bb5f613f3aa893b12f593910644de" }
wordcraft-render = { git = "https://github.com/storytold/wordcraft", rev = "bbe3547dd11bb5f613f3aa893b12f593910644de" }
zip = { version = "=2.2.2", default-features = false, features = ["deflate"] }
zip_guard = { package = "zip", version = "=9.1.3", default-features = false }
hound = { version = "=3.5.1", optional = true }
mp3dec = { version = "=0.1.0", optional = true }
ogg = { version = "=0.9.2", optional = true }
oxideav-aac = { version = "=0.1.7", optional = true }
oxideav-av1 = { version = "=0.1.24", optional = true }
oxideav-core = { version = "=0.1.43", optional = true }
oxideav-h264 = { version = "=0.1.12", optional = true }
oxideav-mkv = { version = "=0.0.12", optional = true }
oxideav-mp4 = { version = "=0.0.11", optional = true }
oxideav-opus = { version = "=0.0.15", optional = true }
oxideav-theora = { version = "=0.0.13", optional = true }
oxideav-vorbis = { version = "=0.0.12", optional = true }
oxideav-vp8 = { version = "=0.2.9", optional = true }
oxideav-vp9 = { version = "=0.0.15", optional = true }
parley = { version = "=0.13.0", default-features = false, features = ["std"] }
wordcraft-fonts = { git = "https://github.com/storytold/wordcraft", rev = "bbe3547dd11bb5f613f3aa893b12f593910644de", version = "0.14.0" }

[patch.crates-io]
hayro = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
hayro-cmap = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
hayro-interpret = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
hayro-postscript = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "03996b10258288e723c4e07334c9cd1bae1f68a8" }
krilla = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
