[package]
name = "pydoccraft-core"
version = "0.2.1"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]
path = "rust/src/lib.rs"

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
base64 = "=0.22.1"
deckcraft-model = { git = "https://github.com/narain1/deckcraft", rev = "16de1ca86058a96f1194c2ddc3a090c7f63f2640" }
deckcraft-pdf = { git = "https://github.com/narain1/deckcraft", rev = "16de1ca86058a96f1194c2ddc3a090c7f63f2640" }
deckcraft-pptx = { git = "https://github.com/narain1/deckcraft", rev = "16de1ca86058a96f1194c2ddc3a090c7f63f2640" }
deckcraft-render = { git = "https://github.com/narain1/deckcraft", rev = "16de1ca86058a96f1194c2ddc3a090c7f63f2640" }
kurbo = "=0.13.1"
pdfcraft-annot = { git = "https://github.com/narain1/pdfcraft", rev = "516caea956c0aaf15f2bd1f35a15e07c73a9ead6" }
pdfcraft-cos = { git = "https://github.com/narain1/pdfcraft", rev = "516caea956c0aaf15f2bd1f35a15e07c73a9ead6" }
pdfcraft-model = { git = "https://github.com/narain1/pdfcraft", rev = "516caea956c0aaf15f2bd1f35a15e07c73a9ead6" }
pdfcraft-content = { git = "https://github.com/narain1/pdfcraft", rev = "516caea956c0aaf15f2bd1f35a15e07c73a9ead6" }
pdfcraft-create = { git = "https://github.com/narain1/pdfcraft", rev = "516caea956c0aaf15f2bd1f35a15e07c73a9ead6" }
pdfcraft-edit = { git = "https://github.com/narain1/pdfcraft", rev = "516caea956c0aaf15f2bd1f35a15e07c73a9ead6" }
pdfcraft-export = { git = "https://github.com/narain1/pdfcraft", rev = "516caea956c0aaf15f2bd1f35a15e07c73a9ead6" }
pdfcraft-fonts = { git = "https://github.com/narain1/pdfcraft", rev = "516caea956c0aaf15f2bd1f35a15e07c73a9ead6" }
pdfcraft-forms = { git = "https://github.com/narain1/pdfcraft", rev = "516caea956c0aaf15f2bd1f35a15e07c73a9ead6" }
pdfcraft-organize = { git = "https://github.com/narain1/pdfcraft", rev = "516caea956c0aaf15f2bd1f35a15e07c73a9ead6" }
pdfcraft-render = { git = "https://github.com/narain1/pdfcraft", rev = "516caea956c0aaf15f2bd1f35a15e07c73a9ead6" }
png = "=0.18.1"
pyo3 = { version = "=0.23.5" }
quick-xml = "=0.41.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.138"
skrifa = "=0.44.0"
thiserror = "=2.0.21"
wordcraft-doc = { git = "https://github.com/narain1/wordcraft", rev = "a57b416783b8ba25ec44e30ee0c3cd8362c44974" }
wordcraft-docx = { git = "https://github.com/narain1/wordcraft", rev = "a57b416783b8ba25ec44e30ee0c3cd8362c44974" }
wordcraft-layout = { git = "https://github.com/narain1/wordcraft", rev = "a57b416783b8ba25ec44e30ee0c3cd8362c44974" }
wordcraft-pdf = { git = "https://github.com/narain1/wordcraft", rev = "a57b416783b8ba25ec44e30ee0c3cd8362c44974" }
wordcraft-render = { git = "https://github.com/narain1/wordcraft", rev = "a57b416783b8ba25ec44e30ee0c3cd8362c44974" }
zip = { version = "=2.2.2", default-features = false, features = ["deflate"] }

[patch.crates-io]
hayro = { path = "vendor/pdfcraft/hayro" }
hayro-interpret = { path = "vendor/pdfcraft/hayro-interpret" }
hayro-jbig2 = { path = "vendor/pdfcraft/hayro-jbig2" }
hayro-syntax = { path = "vendor/pdfcraft/hayro-syntax" }
lopdf = { path = "vendor/pdfcraft/lopdf" }
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c3487320b2d1de657b860b3c8abb44e1f2b32bd8" }
