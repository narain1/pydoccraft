[package]
name = "pydoccraft-core"
version = "0.3.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]
path = "rust/src/lib.rs"

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
base64 = "=0.22.1"
deckcraft-model = { git = "https://github.com/storytold/deckcraft", rev = "5fadda5ecfda00e11e364f095a31974f54857e21" }
deckcraft-pdf = { git = "https://github.com/storytold/deckcraft", rev = "5fadda5ecfda00e11e364f095a31974f54857e21" }
deckcraft-pptx = { git = "https://github.com/storytold/deckcraft", rev = "5fadda5ecfda00e11e364f095a31974f54857e21" }
deckcraft-render = { git = "https://github.com/storytold/deckcraft", rev = "5fadda5ecfda00e11e364f095a31974f54857e21" }
kurbo = "=0.13.1"
pdfcraft-annot = { git = "https://github.com/storytold/pdfcraft", rev = "0b670caf4a090e9d83a7f41a84b4cb2144a2d33e" }
pdfcraft-cos = { git = "https://github.com/storytold/pdfcraft", rev = "0b670caf4a090e9d83a7f41a84b4cb2144a2d33e" }
pdfcraft-model = { git = "https://github.com/storytold/pdfcraft", rev = "0b670caf4a090e9d83a7f41a84b4cb2144a2d33e" }
pdfcraft-content = { git = "https://github.com/storytold/pdfcraft", rev = "0b670caf4a090e9d83a7f41a84b4cb2144a2d33e" }
pdfcraft-create = { git = "https://github.com/storytold/pdfcraft", rev = "0b670caf4a090e9d83a7f41a84b4cb2144a2d33e" }
pdfcraft-edit = { git = "https://github.com/storytold/pdfcraft", rev = "0b670caf4a090e9d83a7f41a84b4cb2144a2d33e" }
pdfcraft-export = { git = "https://github.com/storytold/pdfcraft", rev = "0b670caf4a090e9d83a7f41a84b4cb2144a2d33e" }
pdfcraft-fonts = { git = "https://github.com/storytold/pdfcraft", rev = "0b670caf4a090e9d83a7f41a84b4cb2144a2d33e" }
pdfcraft-forms = { git = "https://github.com/storytold/pdfcraft", rev = "0b670caf4a090e9d83a7f41a84b4cb2144a2d33e" }
pdfcraft-organize = { git = "https://github.com/storytold/pdfcraft", rev = "0b670caf4a090e9d83a7f41a84b4cb2144a2d33e" }
pdfcraft-render = { git = "https://github.com/storytold/pdfcraft", rev = "0b670caf4a090e9d83a7f41a84b4cb2144a2d33e" }
png = "=0.18.1"
pyo3 = { version = "=0.23.5" }
quick-xml = "=0.41.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.138"
skrifa = "=0.44.0"
thiserror = "=2.0.21"
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "c524027f34be2d1322b23064f80662d3638cf880" }
wordcraft-docx = { git = "https://github.com/storytold/wordcraft", rev = "c524027f34be2d1322b23064f80662d3638cf880" }
wordcraft-layout = { git = "https://github.com/storytold/wordcraft", rev = "c524027f34be2d1322b23064f80662d3638cf880" }
wordcraft-pdf = { git = "https://github.com/storytold/wordcraft", rev = "c524027f34be2d1322b23064f80662d3638cf880" }
wordcraft-render = { git = "https://github.com/storytold/wordcraft", rev = "c524027f34be2d1322b23064f80662d3638cf880" }
zip = { version = "=2.2.2", default-features = false, features = ["deflate"] }

[patch.crates-io]
hayro = { path = "vendor/pdfcraft/hayro" }
hayro-cmap = { path = "vendor/pdfcraft/hayro-cmap" }
hayro-interpret = { path = "vendor/pdfcraft/hayro-interpret" }
hayro-jbig2 = { path = "vendor/pdfcraft/hayro-jbig2" }
hayro-syntax = { path = "vendor/pdfcraft/hayro-syntax" }
lopdf = { path = "vendor/pdfcraft/lopdf" }
krilla = { git = "https://github.com/storytold/craft-libs", rev = "9f75d3dc19b4b514c4f3d4847ed1ec1b0e86b4ef" }
